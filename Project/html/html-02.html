<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HTML - Semantic Layout</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; max-width: 700px; margin: auto; }
    .nav-bar { display: flex; justify-content: space-between; margin-bottom: 2rem; }
    .nav-bar a { color: #38bdf8; text-decoration: none; }
    header, nav, section, article, footer { background: #1e293b; border: 1px solid #334155; padding: 1rem; margin-bottom: 0.75rem; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="nav-bar">
    <a href="../index.html">&larr; Home</a>
    <a href="index.html">HTML Programs &rarr;</a>
  </div>
  <header><h3>Semantic Header Area</h3></header>
  <nav>Navigation Block: [Link 1] [Link 2] [Link 3]</nav>
  <section>
    <h3>Section Element</h3>
    <article>
      <h4>Article Entry</h4>
      <p>Content enclosed within dedicated semantic tags to improve accessibility and document structure.</p>
    </article>
  </section>
  <footer>Footer Content &copy; 2026</footer>
</body>
</html>
