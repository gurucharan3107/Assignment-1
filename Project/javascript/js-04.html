<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Countdown Timer</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 2rem 1rem; }
    .nav-bar { width: 100%; max-width: 350px; display: flex; justify-content: space-between; margin-bottom: 1.5rem; }
    .nav-bar a { color: #38bdf8; text-decoration: none; }
    .box { background: #1e293b; padding: 1.5rem; border-radius: 12px; text-align: center; width: 100%; max-width: 350px; box-sizing: border-box; }
    input { width: 80px; padding: 6px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 4px; text-align: center; }
    button { background: #0284c7; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    #countdownDisplay { font-size: 2.2rem; font-family: monospace; color: #38bdf8; margin: 1rem 0; }
  </style>
</head>
<body>
  <div class="nav-bar">
    <a href="../index.html">&larr; Home</a>
    <a href="index.html">JS Programs &rarr;</a>
  </div>
  <div class="box">
    <h2>Countdown Timer</h2>
    <div style="margin: 1rem 0;">
      <input type="number" id="timeInput" min="1" placeholder="Secs" />
      <button onclick="startCountdown()">Start</button>
    </div>
    <div id="countdownDisplay">00s</div>
  </div>
  <script>
    let countdownInterval = null;
    function startCountdown() {
      clearInterval(countdownInterval);
      let remaining = parseInt(document.getElementById('timeInput').value);
      if (isNaN(remaining) || remaining <= 0) return;
      const display = document.getElementById('countdownDisplay');
      display.innerText = `${remaining}s`;
      countdownInterval = setInterval(() => {
        remaining--;
        display.innerText = `${remaining}s`;
        if (remaining <= 0) {
          clearInterval(countdownInterval);
          display.innerText = "Time's up!";
        }
      }, 1000);
    }
  </script>
</body>
</html>
