<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Digital Clock</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 2rem 1rem; }
    .nav-bar { width: 100%; max-width: 400px; display: flex; justify-content: space-between; margin-bottom: 1.5rem; }
    .nav-bar a { color: #38bdf8; text-decoration: none; }
    .clock-box { background: #1e293b; padding: 2rem; border-radius: 12px; text-align: center; width: 100%; max-width: 400px; box-sizing: border-box; }
    #time { font-size: 2.5rem; font-weight: bold; color: #38bdf8; margin: 1rem 0; font-family: monospace; }
  </style>
</head>
<body>
  <div class="nav-bar">
    <a href="../index.html">&larr; Home</a>
    <a href="index.html">JS Programs &rarr;</a>
  </div>
  <div class="clock-box">
    <h2>Digital Clock</h2>
    <div id="time">00:00:00</div>
    <div id="date" style="color:#94a3b8;"></div>
  </div>
  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('time').innerText = now.toLocaleTimeString();
      document.getElementById('date').innerText = now.toDateString();
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
