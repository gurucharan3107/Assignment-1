<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Digital Calculator</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 2rem 1rem; }
    .nav-bar { width: 100%; max-width: 320px; display: flex; justify-content: space-between; margin-bottom: 1.5rem; }
    .nav-bar a { color: #38bdf8; text-decoration: none; font-size: 0.9rem; }
    .app { background: #1e293b; padding: 1.5rem; border-radius: 12px; width: 320px; box-sizing: border-box; }
    #screen { width: 100%; height: 50px; background: #0f172a; border: 1px solid #334155; color: #fff; font-size: 1.5rem; text-align: right; padding: 0 10px; border-radius: 6px; box-sizing: border-box; margin-bottom: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    button { padding: 12px; font-size: 1.1rem; border: none; border-radius: 6px; background: #334155; color: #fff; cursor: pointer; }
    button:hover { background: #475569; }
    button.op { background: #0284c7; }
  </style>
</head>
<body>
  <div class="nav-bar">
    <a href="../index.html">&larr; Home</a>
    <a href="index.html">JS Programs &rarr;</a>
  </div>
  <div class="app">
    <h3 style="margin-bottom:1rem;">Digital Calculator</h3>
    <input type="text" id="screen" readonly />
    <div class="grid">
      <button onclick="clearScreen()">C</button>
      <button onclick="appendVal('/')">/</button>
      <button onclick="appendVal('*')">&times;</button>
      <button onclick="appendVal('-')">-</button>
      <button onclick="appendVal('7')">7</button>
      <button onclick="appendVal('8')">8</button>
      <button onclick="appendVal('9')">9</button>
      <button onclick="appendVal('+')">+</button>
      <button onclick="appendVal('4')">4</button>
      <button onclick="appendVal('5')">5</button>
      <button onclick="appendVal('6')">6</button>
      <button class="op" onclick="calculate()">=</button>
      <button onclick="appendVal('1')">1</button>
      <button onclick="appendVal('2')">2</button>
      <button onclick="appendVal('3')">3</button>
      <button onclick="appendVal('0')">0</button>
    </div>
  </div>
  <script>
    const screen = document.getElementById('screen');
    function appendVal(val) { screen.value += val; }
    function clearScreen() { screen.value = ''; }
    function calculate() {
      try {
        if (screen.value) screen.value = Function('"use strict";return (' + screen.value + ')')();
      } catch (e) { screen.value = 'Error'; }
    }
  </script>
</body>
</html>
