<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stopwatch</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 2rem 1rem; }
    .nav-bar { width: 100%; max-width: 350px; display: flex; justify-content: space-between; margin-bottom: 1.5rem; }
    .nav-bar a { color: #38bdf8; text-decoration: none; }
    .box { background: #1e293b; padding: 2rem; border-radius: 12px; text-align: center; width: 100%; max-width: 350px; box-sizing: border-box; }
    #display { font-size: 2.5rem; font-family: monospace; color: #38bdf8; margin: 1.5rem 0; }
    button { padding: 0.5rem 1rem; border: none; border-radius: 4px; color: #fff; cursor: pointer; margin: 0 4px; }
    .start { background: #10b981; } .stop { background: #ef4444; } .reset { background: #64748b; }
  </style>
</head>
<body>
  <div class="nav-bar">
    <a href="../index.html">&larr; Home</a>
    <a href="index.html">JS Programs &rarr;</a>
  </div>
  <div class="box">
    <h2>Stopwatch</h2>
    <div id="display">00:00:00</div>
    <button class="start" onclick="startTimer()">Start</button>
    <button class="stop" onclick="stopTimer()">Stop</button>
    <button class="reset" onclick="resetTimer()">Reset</button>
  </div>
  <script>
    let seconds = 0, timerInterval = null;
    function formatTime(s) {
      const hrs = String(Math.floor(s / 3600)).padStart(2, '0');
      const mins = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
      const secs = String(s % 60).padStart(2, '0');
      return `${hrs}:${mins}:${secs}`;
    }
    function startTimer() {
      if (!timerInterval) {
        timerInterval = setInterval(() => {
          seconds++;
          document.getElementById('display').innerText = formatTime(seconds);
        }, 1000);
      }
    }
    function stopTimer() { clearInterval(timerInterval); timerInterval = null; }
    function resetTimer() { stopTimer(); seconds = 0; document.getElementById('display').innerText = "00:00:00"; }
  </script>
</body>
</html>
