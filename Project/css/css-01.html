<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CSS - Flexbox & Grid</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; max-width: 700px; margin: auto; }
    .nav-bar { display: flex; justify-content: space-between; margin-bottom: 2rem; }
    .nav-bar a { color: #38bdf8; text-decoration: none; }
    .box { background: #1e293b; padding: 1.5rem; border-radius: 8px; border: 1px solid #334155; margin-bottom: 1.5rem; }
    .flex-container { display: flex; gap: 10px; justify-content: space-around; background: #0f172a; padding: 1rem; border-radius: 6px; }
    .flex-item { background: #0284c7; padding: 1rem; border-radius: 4px; text-align: center; flex: 1; }
    .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #0f172a; padding: 1rem; border-radius: 6px; margin-top: 1rem; }
    .grid-item { background: #0d9488; padding: 1rem; border-radius: 4px; text-align: center; }
  </style>
</head>
<body>
  <div class="nav-bar">
    <a href="../index.html">&larr; Home</a>
    <a href="index.html">CSS Programs &rarr;</a>
  </div>
  <div class="box">
    <h2>Flexbox Distribution</h2>
    <div class="flex-container">
      <div class="flex-item">Flex 1</div>
      <div class="flex-item">Flex 2</div>
      <div class="flex-item">Flex 3</div>
    </div>
    <h2 style="margin-top:1.5rem;">CSS Grid System</h2>
    <div class="grid-container">
      <div class="grid-item">Grid 1</div>
      <div class="grid-item">Grid 2</div>
      <div class="grid-item">Grid 3</div>
    </div>
  </div>
</body>
</html>
