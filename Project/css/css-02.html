<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CSS - Animations</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; max-width: 700px; margin: auto; }
    .nav-bar { display: flex; justify-content: space-between; margin-bottom: 2rem; }
    .nav-bar a { color: #38bdf8; text-decoration: none; }
    .box { background: #1e293b; padding: 2rem; border-radius: 8px; border: 1px solid #334155; text-align: center; }
    .animated-box {
      width: 80px;
      height: 80px;
      background: #38bdf8;
      margin: 2rem auto;
      border-radius: 8px;
      animation: spin 3s infinite linear;
      transition: transform 0.3s ease;
    }
    .animated-box:hover { background: #f43f5e; }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="nav-bar">
    <a href="../index.html">&larr; Home</a>
    <a href="index.html">CSS Programs &rarr;</a>
  </div>
  <div class="box">
    <h2>Continuous Spin Animation</h2>
    <p style="color:#94a3b8;">Hover over the square to trigger CSS transition color change.</p>
    <div class="animated-box"></div>
  </div>
</body>
</html>
