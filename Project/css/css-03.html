<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CSS - Responsive Design</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; max-width: 700px; margin: auto; }
    .nav-bar { display: flex; justify-content: space-between; margin-bottom: 2rem; }
    .nav-bar a { color: #38bdf8; text-decoration: none; }
    .responsive-card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 8px;
      border: 2px solid #38bdf8;
      text-align: center;
    }
    .viewport-status::after { content: "Desktop Mode (Wide Viewport)"; color: #38bdf8; font-weight: bold; }
    @media (max-width: 600px) {
      .responsive-card { border-color: #f59e0b; background: #111827; }
      .viewport-status::after { content: "Mobile Mode (Narrow Viewport)"; color: #f59e0b; }
    }
  </style>
</head>
<body>
  <div class="nav-bar">
    <a href="../index.html">&larr; Home</a>
    <a href="index.html">CSS Programs &rarr;</a>
  </div>
  <div class="responsive-card">
    <h2>Responsive Card</h2>
    <p>Resize browser width below 600px to observe style changes.</p>
    <p class="viewport-status">Current Layout: </p>
  </div>
</body>

</html>
